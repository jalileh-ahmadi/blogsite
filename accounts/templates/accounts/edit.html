<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ویرایش پروفایل</title>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .edit-container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 2rem 2.5rem;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* استایل‌دهی عمومی فیلدهای Django */
        input, select, textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.7px solid #dfe6e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.3s ease;
            background: #fdfdfd;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #3498db;
            box-shadow: 0 0 6px rgba(52, 152, 219, 0.25);
            outline: none;
        }

        label {
            font-weight: 600;
            color: #2c3e50;
        }

        .btn-submit {
            margin-top: 1rem;
            padding: 0.9rem;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            cursor: pointer;
            background: #3498db;
            color: white;
            transition: 0.3s ease;
        }

        .btn-submit:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(52,152,219,0.35);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            text-decoration: none;
            font-size: 0.95rem;
            color: #3498db;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .back-link:hover {
            color: #216a98;
        }

        /* استایل عکس پروفایل */
        .profile-image-wrapper {
            text-align: center;
            margin-bottom: 1rem;
        }

        .profile-image-wrapper img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3498db;
            margin-bottom: 0.5rem;
        }

        .profile-image-wrapper .remove-btn {
            display: inline-block;
            padding: 0.3rem 0.7rem;
            font-size: 0.85rem;
            background: #e74c3c;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s ease;
            text-decoration: none;
        }

        .profile-image-wrapper .remove-btn:hover {
            background: #c0392b;
        }

        @media (max-width: 480px) {
            .edit-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="edit-container">
        <div class="title">ویرایش پروفایل</div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- نمایش عکس فعلی -->
            {% if object.profile_image %}
            <div class="profile-image-wrapper">
                <img src="{{ object.profile_image.url }}" alt="عکس پروفایل فعلی">
            </div>
            {% endif %}

            {{ form }}

            <P style="display:none" id="delete_i">عکس حذف شد</P>
            <button onclick="delete_image('{{ object.id }}')" type="button" class="btn-secondary">حذف عکس پروفایل</button>
            <button type="submit" class="btn-submit">ذخیره تغییرات</button>
        </form>

        <a href="{% url 'blogs:home' %}" class="back-link">بازگشت به صفحه اصلی</a>
    </div>


<script>
    function delete_image(id){
        var element= document.getElementById('delete_i');
        $.get(`/delete_image/${id}`).then(response => {
            if(response['response'] === 'delete'){
                element.style.display = 'block';
            }
        })
    }
</script>

</body>
</html>
